# Confirme a tag exata no Docker Hub antes do primeiro `up` (F0.7).
# Copie .env.example para .env e defina NEO4J_PASSWORD.
services:
  neo4j:
    image: neo4j:2026.10.1
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no arquivo .env}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins
