# llama-swap v267 — perfis do GraphRAG local (ARQUITETURA §9, ADR-001 revisada, ADR-010)
# Sobe por infra/swap.ps1, que define GRAG_ROOT (barras normais) e GRAG_ROOT_WIN (barras invertidas).
# Perfis (matrix.sets): indexar · vetorizar · consultar · consultar-rapido · avaliar · especialista (F6.6)
healthCheckTimeout: 300
startPort: 10001
logLevel: info
globalTTL: 0                # modelos ficam residentes até serem expulsos por outro perfil

macros:
  "vk":      "${env.GRAG_ROOT}/infra/bin/llama-b11932-vulkan/llama-server.exe"
  "hip":     "${env.GRAG_ROOT}/infra/bin/llama-b11932-hip/llama-server.exe"
  "modelos": "C:/modelos"

models:
  # LLM principal: indexar e consultar. Vulkan, sem mmap, experts das 28 primeiras camadas na CPU (ADR-010).
  "qwen36-35b-a3b":
    name: "Qwen3.6-35B-A3B UD-Q4_K_XL"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      -c 32768 -np 2 -ngl 99 --n-cpu-moe 28 -lm none
      -fa on -ctk q8_0 -ctv q8_0 --jinja

  # LLM rápido (consultar-rapido). Inteiro na GPU ele sozinho chega a 15,1 GB com o desktop atual; com 4 camadas
  # de experts na CPU a geração cai de 170 para ~75 tok/s e sobra espaço para embedding e reranker (ADR-011).
  "gpt-oss-20b":
    name: "gpt-oss-20b MXFP4"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/gpt-oss-20b-MXFP4.gguf
      -c 16384 -ngl 99 --n-cpu-moe 4 -lm none -fa on -ctk q8_0 -ctv q8_0 --jinja

  # Embeddings na CPU: perguntas, uma por vez (milissegundos).
  "qwen3-embed-0.6b":
    name: "Qwen3-Embedding-0.6B Q8_0 (CPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embedding --pooling last -ngl 0 -c 8192 -ub 8192

  # Embeddings na GPU: lote da indexação (perfil vetorizar, LLM descarregado).
  "qwen3-embed-0.6b-lote":
    name: "Qwen3-Embedding-0.6B Q8_0 (GPU, lote)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embedding --pooling last -ngl 99 -c 8192 -ub 8192

  # Reranker na GPU: POST /v1/rerank
  "qwen3-rerank-0.6b":
    name: "Qwen3-Reranker-0.6B Q8_0"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/qwen3-reranker-0.6b-q8_0.gguf
      --reranking --pooling rank -ngl 99 -c 4096 -ub 2048

  # Juiz da avaliação: HIP (provisório, ADR-001). As DLLs hipblas/rocblas vêm do venv ROCm.
  "gemma4-26b-a4b-juiz":
    name: "Gemma 4 26B-A4B QAT Q4_0 (juiz, HIP)"
    env:
      - "PATH=${env.GRAG_ROOT_WIN}\\infra\\bin\\rocm-venv\\Lib\\site-packages\\_rocm_sdk_libraries\\bin;${env.GRAG_ROOT_WIN}\\infra\\bin\\rocm-venv\\Lib\\site-packages\\_rocm_sdk_core\\bin;${env.PATH}"
    cmd: |
      "${hip}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/gemma-4-26B_q4_0-it.gguf
      -c 16384 -ngl 99 -fa on --jinja --reasoning-budget 512

  # Especialista Text2Cypher (F6.6, ADR-051): neo4j/text-to-cypher-Gemma-3-4B convertido por mradermacher.
  # Inteiro na GPU (4,1 GB); contexto de 16k cobre o prompt completo (~8k tokens) com folga. Só para comparar
  # com o LLM principal; o padrão do agente continua sendo o qwen36-35b-a3b.
  "gemma3-4b-text2cypher":
    name: "Neo4j Text2Cypher Gemma 3 4B Q8_0"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/text-to-cypher-Gemma-3-4B-Instruct-2025.04.0.Q8_0.gguf
      -c 16384 -ngl 99 -fa on --jinja

  # F9.2 (candidato a LLM do agente e redator): Gemma 4 26B-A4B em Vulkan, sem raciocínio, com parte dos experts na CPU
  # para sobrar VRAM para o reranker (os 14,4 GB do modelo sozinhos já encostam no teto da placa, ver o perfil `avaliar`).
  # O valor de --n-cpu-moe saiu da calibração registrada em eval/f92-medida-bakeoff.md.
  "gemma4-26b-a4b":
    name: "Gemma 4 26B-A4B QAT Q4_0 (agente, Vulkan)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/gemma-4-26B_q4_0-it.gguf
      -c 32768 -np 2 -ngl 99 --n-cpu-moe 8 -fa on -ctk q8_0 -ctv q8_0 --jinja --reasoning-budget 0

  # F9.3 (bake-off de embeddings): candidatos. `-lote` roda na GPU (embute os Filhos e as consultas da medida);
  # o outro roda na CPU, como a consulta de produção (usado só para medir a latência de uma consulta).
  "qwen3-embed-4b-lote":
    name: "Qwen3-Embedding-4B Q8_0 (GPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last -ngl 99 -c 8192 -ub 8192
  "qwen3-embed-4b":
    name: "Qwen3-Embedding-4B Q8_0 (CPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last -ngl 0 -c 8192 -ub 8192
  "embeddinggemma-2-lote":
    name: "EmbeddingGemma 2 Q8_0 (GPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/embeddinggemma-2-Q8_0.gguf
      --embedding -ngl 99 -c 8192 -ub 8192
  "embeddinggemma-2":
    name: "EmbeddingGemma 2 Q8_0 (CPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/embeddinggemma-2-Q8_0.gguf
      --embedding -ngl 0 -c 8192 -ub 8192
  "bge-m3-lote":
    name: "bge-m3 Q8_0 (GPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/bge-m3-q8_0.gguf
      --embedding -ngl 99 -c 8192 -ub 8192
  "bge-m3":
    name: "bge-m3 Q8_0 (CPU)"
    cmd: |
      "${vk}" --host 127.0.0.1 --port ${PORT}
      -m ${modelos}/bge-m3-q8_0.gguf
      --embedding -ngl 0 -c 8192 -ub 8192

routing:
  router:
    use: matrix
    settings:
      matrix:
        vars:
          q:  qwen36-35b-a3b
          g:  gpt-oss-20b
          e:  qwen3-embed-0.6b
          el: qwen3-embed-0.6b-lote
          r:  qwen3-rerank-0.6b
          j:  gemma4-26b-a4b-juiz
          s:  gemma3-4b-text2cypher
          m:  gemma4-26b-a4b
          e4: qwen3-embed-4b-lote
          eg: embeddinggemma-2-lote
          eb: bge-m3-lote
        # Modelos fora de qualquer conjunto rodam sozinhos (expulsam os demais): é o caso de el e j.
        sets:
          indexar:           "q"
          consultar:         "q & e & r"
          consultar-rapido:  "g & e & r"
          vetorizar:         "el"
          avaliar:           "j"
          especialista:      "s & e & r"
          consultar-gemma:   "m & e & r"
          f93-qwen4b:        "e4 & r"
          f93-gemma2:        "eg & r"
          f93-bgem3:         "eb & r"
          f93-qwen06:        "el & r"
