[project]
name = "indexer"
version = "0.1.0"
description = "Indexador do GraphRAG local: parsing, segmentação, extração, grafo e embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j==6.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]
# Parsing de PDF (F1.3): traz o torch e os modelos do Docling. Fica fora do grupo padrão para o CI não baixá-los.
# Localmente: `uv sync --group parse` (um `uv sync` puro remove o Docling) e `uv run --group parse ...`.
parse = [
    "docling==2.144.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
