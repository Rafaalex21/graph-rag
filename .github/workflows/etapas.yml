name: ETAPAS

# Valida o plano e, ao entrar na main, sincroniza as issues com o docs/ETAPAS.md.
on:
  pull_request:
    paths: ["docs/ETAPAS.md", "tools/**"]
  push:
    branches: [main]
    paths: ["docs/ETAPAS.md", "tools/**"]
  workflow_dispatch:

# Duas sincronias simultâneas leem a mesma lista e criam issues em dobro: uma de cada vez.
concurrency:
  group: etapas-sync
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/etapas.py check
      - run: python tools/etapas.py resumo

  sincronizar:
    needs: validar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/etapas_to_issues.py
